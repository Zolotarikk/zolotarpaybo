# Настройки клиента. Меняет разработчик; после правки перезапустить бота.

[studio]
name = "Студия массажа «Релакс»"
about = "Мы работаем с 2020 года. Опытные мастера, спокойная атмосфера, чистота и забота о каждом госте. Подберём массаж под вашу задачу: от снятия усталости после рабочего дня до восстановления спины."
address = "г. Минск, ул. Примерная, 1 (демо-адрес)"
phone = "+375 29 000-00-00"
# Текст для клиентов. Должен совпадать с разделом [schedule] ниже
hours_text = "пн–сб с 10:00 до 20:00, воскресенье — выходной"
# Необязательно: фото для приветствия (файл лежит рядом, в папке клиента)
# и координаты для карты (демо-координаты, у реального клиента свои)
welcome_photo = "welcome.png"
latitude = 53.9006
longitude = 27.5590

[schedule]
timezone_offset_hours = 3          # Беларусь: UTC+3 круглый год
work_start_hour = 10
work_end_hour = 20
work_weekdays = [0, 1, 2, 3, 4, 5] # 0 = понедельник ... 5 = суббота
slot_step_min = 30                 # шаг сетки времени, минут
booking_days_ahead = 14            # на сколько дней вперёд можно записаться
min_notice_min = 30                # минимум минут до начала для новой записи

[rules]
cancel_min_hours = 3               # отмена возможна не позднее чем за столько часов
remind_first_hours = 24            # первое напоминание
remind_second_hours = 2            # второе напоминание
phone_required = true              # просить номер телефона при первой записи
phone_country_code = "375"         # код страны для номеров без «+» (375 = Беларусь)
digest_time = "9:00"              # время утренней сводки владельцу (пустая строка отключает)

[reviews]
enabled = true
request_delay_min = 60             # через сколько минут после конца записи просить оценку
positive_from = 4                  # оценки от этого значения считаются хорошими
public_url = ""                    # ссылка на публичный отзыв (2ГИС, Google и т. д.); пока пусто: заглушка

# Услуги: название, длительность в минутах (кратно 30), цена в BYN.
# Название служит ключом: если его изменить, это будет новая услуга.
[[services]]
name = "Массаж спины"
duration_min = 30
price = 35
description = "Снимает напряжение в мышцах спины после рабочего дня."

[[services]]
name = "Массаж шеи и плеч"
duration_min = 30
price = 30
description = "Для тех, кто много времени проводит за компьютером."

[[services]]
name = "Классический массаж"
duration_min = 60
price = 60
description = "Универсальный массаж всего тела для восстановления и тонуса."

[[services]]
name = "Антицеллюлитный массаж"
duration_min = 60
price = 65
description = "Активная проработка проблемных зон."

[[services]]
name = "Расслабляющий массаж"
duration_min = 90
price = 85
description = "Мягкая техника, чтобы полностью отключиться и восстановить силы."